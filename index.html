<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<title>We'll be right back — Dhaankolhu Rasdhoo Island</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Poppins:ital,wght@0,400;0,500;0,600;0,700&display=swap" rel="stylesheet" />
<style>
  :root {
    --teal: #0b6e70;
    --teal-deep: #123d40;
    --brass: #ba8d5c;
    --ivory: #f5f1e8;
    --ink: #17232a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: "DM Sans", sans-serif;
    color: var(--ivory);
  }
  body {
    background-image:
      linear-gradient(180deg, rgba(9, 21, 27, 0.72) 0%, rgba(9, 21, 27, 0.85) 100%),
      url("img/home%20web.jpeg");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
  }
  @media (max-width: 768px) {
    body {
      background-image:
        linear-gradient(180deg, rgba(9, 21, 27, 0.72) 0%, rgba(9, 21, 27, 0.85) 100%),
        url("img/home%20mobile.jpeg");
      background-attachment: scroll;
    }
  }
  .wrap {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 4vh 6vw 3vh;
  }
  .content {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding-bottom: 8vh;
  }
  .logo {
    height: 288px;
    width: auto;
    margin-bottom: -3rem;
    opacity: 0.95;
  }
  .badge {
    text-transform: uppercase;
    letter-spacing: 0.12em;
    font-size: 0.68rem;
    color: var(--brass);
    font-weight: 600;
    margin-bottom: 0.5rem;
  }
  h1 {
    font-family: "Poppins", sans-serif;
    font-weight: 600;
    font-size: clamp(1.3rem, 3vw, 2rem);
    margin: 0 0 0.6rem;
    letter-spacing: -0.01em;
  }
  p {
    max-width: 420px;
    font-size: 0.88rem;
    line-height: 1.6;
    color: #cdd6e2;
    margin: 0 auto 1.4rem;
  }
  .contact {
    display: flex;
    gap: 1.2rem;
    flex-wrap: wrap;
    justify-content: center;
    margin-bottom: 1.8rem;
  }
  .contact a {
    color: var(--ivory);
    text-decoration: none;
    font-size: 0.82rem;
    padding: 0.55rem 1.1rem;
    border: 1px solid rgba(245,241,232,0.25);
    border-radius: 999px;
    transition: background 0.2s ease, border-color 0.2s ease;
    backdrop-filter: blur(4px);
    background: rgba(9, 21, 27, 0.25);
  }
  .contact a:hover {
    background: rgba(245,241,232,0.12);
    border-color: rgba(245,241,232,0.5);
  }
  .foot {
    font-size: 0.68rem;
    color: #cdd6e2;
    margin-top: 1.5rem;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="content">
      <img class="logo" src="img/logo/logo%20white.png" alt="Dhaankolhu Rasdhoo Island logo" />
      <div class="badge">Under Maintenance</div>
      <h1>We're polishing things up.</h1>
      <p>Our website is currently getting a quick refresh. thank you for your patience.</p>
      <div class="contact">
        <a href="https://wa.me/9609898130" target="_blank" rel="noopener">WhatsApp: +960 989 8130</a>
        <a href="mailto:info@dhaankolhu.com">info@dhaankolhu.com</a>
      </div>
    </div>
    <div class="foot">&copy; 2026 Dhaankolhu Rasdhoo Island. All rights reserved.</div>
  </div>
</body>
</html>
